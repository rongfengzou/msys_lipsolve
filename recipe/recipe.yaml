schema_version: 1

context:
  name: msys_viparr
  version: "1.7.359"
  viparr_version: "4.7.35"
  # Upstream provenance of the vendored trees (see README "Source provenance"):
  #   msys/       DEShawResearch/msys   30aa5b6f2c4521e4081281e4210cae6d92bd5f19 (2025-12-05)
  #   viparr/     DEShawResearch/viparr d0c869df9a44e1fdaf5f1ce44646178c30cff6e5
  #   bliss-0.73/ tcs.hut.fi bliss-0.73.zip
  # plus the patches in recipe/patches/, already applied.

package:
  name: ${{ name }}
  version: ${{ version }}

# The sources are the vendored, already-patched trees at the repository root;
# nothing is downloaded for them. recipe/patches/ documents the changes
# relative to upstream but is not applied here.
source:
  - path: ../msys
  - path: ../bliss-0.73
    target_directory: external/bliss/bliss-0.73
  - path: ../viparr
    target_directory: viparr

build:
  number: 2
  skip:
    - win
  script: build.sh

requirements:
  build:
    - ${{ compiler('c') }}
    - ${{ compiler('cxx') }}
    - scons
  host:
    - python
    - numpy
    - pybind11
    - libboost-headers
    - lp_solve
    - rapidjson
    - zlib
    - libsqlite
  run:
    - python
    - lp_solve 5.5.*
    - rdkit
    # libsqlite / libzlib: do not take the host run_exports (they pin to
    # whatever version the build env resolved, e.g. libsqlite >=3.54.1, which
    # cannot coexist with icu 75 and broke installs into existing envs).
    # msys uses only the sqlite3 3.5-era API (open_v2/prepare_v2/step/bind/
    # column) and plain inflate/deflate, so any conda-forge build works.
    - libsqlite >=3.39,<4.0a0
    - libzlib >=1.2.13,<2.0a0
  ignore_run_exports:
    by_name:
      - libsqlite
      - libzlib
  run_constraints:
    # the old dp.tech package ships the same site-packages/msys and bin/ files;
    # never let both be installed in one env
    - msys_viparr_lpsolve55 <0a0

tests:
  - python:
      imports:
        - msys
        - msys.molfile
        - msys.pfx
        - viparr
  - script:
      - dms-info -h
      - dms-select -h
      - dms-validate -h
      - dms-version -h
      - viparr -h
      - viparr-convert-amber -h
      - python -c "import msys; s = msys.FromSmilesString('CC'); msys.AssignBondOrderAndFormalCharge(s); assert s.atom(0).formal_charge == 0"
      - python -c "import numpy, msys; m = msys.FromSmilesString('O'); p = m.positions; assert p.shape == (3, 3), p.shape; print('numpy', numpy.__version__)"

about:
  homepage: https://github.com/DEShawResearch/msys
  license: BSD-3-Clause
  license_file:
    - LICENSE.txt
    - viparr/LICENSE.txt
  summary: msys + viparr (D. E. Shaw Research) with lpsolve bond-order assignment and bliss
  description: |
    msys ${{ version }} and viparr ${{ viparr_version }} built from the
    DEShawResearch GitHub sources, with lpsolve (bond order / formal charge
    assignment), bliss (resonant charge acceleration), rapidjson, and the
    gromacs xtc reader. Built against current conda-forge boost, numpy 2 and
    pybind11; no pin to python 3.10 / numpy 1.
  repository: https://github.com/DEShawResearch/viparr
